name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutomationHub.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutomationHub-apk
          path: AutomationHub.apk
          retention-days: 90

      - name: Decode release keystore
        run: base64 -d app/release.keystore.enc.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}" > release.keystore
      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk AutomationHub-release.apk
      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutomationHub-release-apk
          path: AutomationHub-release.apk
          retention-days: 90
