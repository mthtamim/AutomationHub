plugins {
    id 'com.android.application'
    // v1.2.6: Baseline Profile plugin (AndroidX) — adds the
    // :app:generateBaselineProfile task and lets the release build
    // consume the profile from the :baselineprofile module. No
    // profile file exists yet, so nothing changes in what ships.
    id 'androidx.baselineprofile'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mthtamim.phonelinkflows'
    compileSdk 34

    defaultConfig {
        applicationId "com.mthtamim.phonelinkflows"
        minSdk 26
        targetSdk 34
        versionCode 24
        versionName "1.4.13"
        // Same arm64-only trade-off as PhoneLink: the APK does not
        // install on emulators or 32-bit-only phones.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // v1.2.1: the debug keystore is stored base64-encoded in
    // debug.keystore.b64 (the snapshot push cannot carry binary
    // files); decode it at build time so signingConfigs below can
    // use it. The decoded file is never committed.
    def debugKeystoreFile = file("debug.keystore")
    if (!debugKeystoreFile.exists()) {
        def b64File = file("debug.keystore.b64")
        if (b64File.exists()) {
            debugKeystoreFile.bytes =
                b64File.text.replaceAll("\\s", "").decodeBase64()
        }
    }

    // v1.2.5: release keystore path. The env value is repo-root
    // relative (CI decodes the RELEASE_KEYSTORE_B64 secret into
    // app/release.keystore and passes
    // RELEASE_KEYSTORE_PATH=app/release.keystore) — but file() here
    // resolves against the app/ module dir, so a bare file() would
    // look for app/app/release.keystore and never find it, and the
    // guard below would silently leave every CI release unsigned.
    // Resolve the env path against the root first, then the module;
    // with no env, use release.keystore next to this file (local
    // builds). The file itself is never in the repo.
    def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
    def releaseKeystoreFile = releaseKeystorePath != null
        ? (rootProject.file(releaseKeystorePath).exists()
            ? rootProject.file(releaseKeystorePath)
            : file(releaseKeystorePath))
        : file("release.keystore")

    signingConfigs {
        // v1.2.1: ONE fixed debug key for every build. Before this,
        // assembleDebug signed with a fresh keystore generated on
        // each CI runner, so every build had a different signature
        // and Android refused to install it over the previous one
        // ("App not installed"). This keystore is a DEBUG-only key
        // (same DN/passwords as Android's default debug key); it is
        // not a release key and must never sign a release.
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "PKCS12"
        }
        // v1.2.5: release signing, keyed ONLY by env vars — the
        // release keystore is never in the repo (public). CI decodes
        // the RELEASE_KEYSTORE_B64 secret into release.keystore and
        // passes RELEASE_KEYSTORE_PATH/PASSWORD/ALIAS/KEY_PASSWORD.
        // A local build without the env keeps working: the release
        // buildType stays unsigned (see the guard below).
        release {
            storeFile releaseKeystoreFile
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "automationhub"
            keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            // Release groundwork (2026-11-06): minify + shrink on.
            // CI builds debug AND release, so minify IS exercised
            // by CI — the first release build must still be
            // phone-tested.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // v1.2.5: sign the release ONLY when the keystore file
            // exists AND the password env var is set; otherwise the
            // release stays unsigned exactly as before (debug CI and
            // local builds without the env keep working).
            if (releaseKeystoreFile.exists() &&
                System.getenv("RELEASE_KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Dependency audit (2026-11-06, grep over the kept tree — every
// keep/remove below names its evidence; see README for the table).
// REMOVED vs PhoneLink v2.25.2:
// - com.google.mlkit:translate — zero references in kept code.
// - com.google.mlkit:text-recognition — zero references in kept code.
// - com.google.mlkit:translate — zero references in kept code.
// - com.google.mlkit:text-recognition — zero references in kept code.
// (2026-11-06 CI fix: play-services-location was removed here on a
//  wrong audit — FlowTriggers.activityRec uses ActivityRecognition
//  + GoogleApiAvailability and FlowSystemReceiver extracts
//  ActivityRecognitionResult/DetectedActivity for the flow_activity
//  trigger. It is re-added below; the "zero references" claim was
//  false because the audit only grepped LocationServices/FusedLocation.)
// KEPT, with evidence:
// - lifecycle-service: SnapService.kt extends LifecycleService.
// - camera-video: SnapService.kt recordVideo() uses Recorder /
//   VideoCapture / FileOutputOptions.
// - camera-core/camera2/lifecycle/view: FlowScanActivity.kt
//   (ImageAnalysis, ProcessCameraProvider, PreviewView) and
//   FlowCameraActivity.kt (ImageCapture).
// - mlkit barcode-scanning: FlowScanActivity.kt imports
//   com.google.mlkit.vision.barcode.BarcodeScanning (qr_scan).
// - zxing core: QrShow.kt uses MultiFormatWriter / BarcodeFormat.
// - biometric: AppLocker.kt / AppLockUi.kt / LockActivity.kt.
// - shizuku api+provider: ShizukuHelper.kt + manifest provider.
// - paho mqtt: MqttManager.kt (mqtt_publish action).
// ADDED:
// - androidx.core:core-ktx: androidx.core.* is imported in ~20 kept
//   files (ContextCompat, NotificationCompat, FileProvider); made
//   explicit instead of relying on appcompat's transitive copy.
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.google.zxing:core:3.5.3"
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation "androidx.camera:camera-video:1.3.4"
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    // Play Services location for the Flow activity-recognition
    // trigger (FlowTriggers.activityRec + FlowSystemReceiver).
    implementation "com.google.android.gms:play-services-location:21.0.1"
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"
    // v1.4.7: JavaScript action (Rhino, interpreter mode).
    implementation "org.mozilla:rhino:1.8.0"
    // v1.4.12: SFTP actions (mwiede JSch fork, Maven Central).
    implementation "com.github.mwiede:jsch:0.2.21"
    // v1.2.6: consume the baseline profile produced by the
    // :baselineprofile module (none exists yet — the release build
    // simply ships without a profile until one is generated).
    baselineProfile project(':baselineprofile')
}
