plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mthtamim.phonelinkflows'
    compileSdk 34

    defaultConfig {
        applicationId "com.mthtamim.phonelinkflows"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // Same arm64-only trade-off as PhoneLink: the APK does not
        // install on emulators or 32-bit-only phones.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.google.zxing:core:3.5.3"
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation "androidx.camera:camera-video:1.3.4"
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"
    implementation "com.google.mlkit:translate:17.0.3"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // ML Kit bundled barcode scanner for the Flow qr_scan action
    // (offline, no Play Services dependency), and Play Services
    // location for Flow activity recognition.
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "com.google.android.gms:play-services-location:21.0.1"
    // MQTT client for the Flow mqtt_publish action.
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"
}
